server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver — lets nginx resolve service names
    # (django, etc.) lazily per-request instead of once at config load/test
    # time. Without this, `nginx -t` fails outside a compose network because
    # it tries to resolve "django" immediately and there's no such host.
    resolver 127.0.0.11 valid=30s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to Django
    location /api/ {
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy allauth URLs to Django (NEW)
    location /accounts/ {
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream/accounts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /var/www/media/;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}