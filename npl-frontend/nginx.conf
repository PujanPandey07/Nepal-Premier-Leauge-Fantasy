server {
    listen 80;
    server_name nplfantasy.duckdns.org;

    # Certbot renewal still needs this on port 80
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name nplfantasy.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/nplfantasy.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nplfantasy.duckdns.org/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20M;

    # Docker's embedded DNS resolver
    resolver 127.0.0.11 valid=30s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── Django static files (populated by collectstatic) ──
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── User-uploaded media ──
    location /media/ {
        alias /var/www/media/;
    }

    # ── Django admin proxy ──
    location /admin/ {
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ── API proxy ──
    location /api/ {
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ── allauth proxy ──
    location /accounts/ {
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── React SPA fallback (must be LAST) ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}