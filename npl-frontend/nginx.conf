server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver — lets nginx resolve service names
    # (django, etc.) lazily per-request instead of once at config load/test
    # time. Without this, `nginx -t` fails outside a compose network because
    # it tries to resolve "django" immediately and there's no such host.
    resolver 127.0.0.11 valid=30s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to Django.
    # IMPORTANT: no URI is appended after $django_upstream. When proxy_pass
    # uses a variable, nginx's usual "replace the matched location prefix"
    # rewriting does not apply the same way it does for a literal proxy_pass
    # target — appending a URI here caused /api/auth/complete/ etc. to be
    # routed incorrectly. Passing no URI means nginx forwards the original
    # request path completely unchanged, which is well-defined behavior and
    # matches what the original literal proxy_pass did.
    location /api/ {
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy allauth URLs to Django (NEW)
    location /accounts/ {
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /var/www/media/;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}