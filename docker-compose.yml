services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    build:
      context: ./fpl_backend
    container_name: django
    env_file:
      - .env
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn fpl_backend.wsgi:application -b 0.0.0.0:8000 --workers 3 --timeout 60"

  celery:
    build:
      context: ./fpl_backend
    container_name: celery
    env_file:
      - .env
    command: celery -A fpl_backend worker -l info
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  celery-beat:
    build:
      context: ./fpl_backend
    container_name: celery-beat
    env_file:
      - .env
    command: celery -A fpl_backend beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./npl-frontend
    container_name: frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./npl-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - django
    restart: unless-stopped

volumes:
  postgres_data:
  media_volume:
  static_volume:
  redis_data:
  certbot_conf:
  certbot_www:
