version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    build:
      context: ./fpl_backend
    container_name: django
    env_file:
      - .env
    volumes:
      - media_volume:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  celery:
    build:
      context: ./fpl_backend
    container_name: celery
    env_file:
      - .env
    command: celery -A fpl_backend worker -l info
    depends_on:
      - postgres
    restart: unless-stopped

  celery-beat:
    build:
      context: ./fpl_backend
    container_name: celery-beat
    env_file:
      - .env
    command: celery -A fpl_backend beat -l info
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./npl-frontend
    container_name: frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./npl-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_volume:/var/www/media:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - django
    restart: unless-stopped

volumes:
  postgres_data:
  media_volume:
  certbot_conf:
  certbot_www:
