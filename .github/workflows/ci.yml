name: CI

on:
  push:
    branches: [Master, main]
  pull_request:
    branches: [Master, main]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for hardcoded localhost URLs in frontend
        run: |
          if grep -r "localhost:8000" npl-frontend/src/; then
            echo "❌ Found hardcoded localhost:8000 in frontend"
            exit 1
          fi
          echo "✅ No hardcoded localhost URLs found"

      - name: Create test .env
        run: |
          cat > .env << 'EOF'
          DEBUG=True
          SECRET_KEY=ci-test-secret-key-not-for-production
          DB_NAME=test_db
          DB_HOST=postgres
          DB_USER=test_user
          DB_PASSWORD=test_password
          DB_PORT=5432
          REDIS_URL=redis://redis:6379/0
          ALLOWED_HOSTS=localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:5173
          CSRF_TRUSTED_ORIGINS=http://localhost,http://localhost:5173
          EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
          EOF

      - name: Validate docker-compose syntax
        run: docker compose config

      - name: Validate nginx config
        run: |
          docker run --rm -v "$PWD/npl-frontend/nginx.ci.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test .env
        run: |
          cat > .env << 'EOF'
          DEBUG=True
          SECRET_KEY=ci-test-secret-key-not-for-production
          DB_NAME=test_db
          DB_HOST=postgres
          DB_USER=test_user
          DB_PASSWORD=test_password
          DB_PORT=5432
          REDIS_URL=redis://redis:6379/0
          ALLOWED_HOSTS=localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:5173
          CSRF_TRUSTED_ORIGINS=http://localhost,http://localhost:5173
          EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
          EOF

      - name: Build all services
        run: docker compose build

      - name: Verify frontend builds
        run: |
          if [ -f npl-frontend/.env.production ]; then
            echo "✅ Found .env.production"
          else
            echo "⚠️  Warning: npl-frontend/.env.production not found (create it to bake production URLs into the build)"
          fi
          docker build -t npl-frontend ./npl-frontend

  test-django:
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Django image
        run: docker build -t npl-django ./fpl_backend

      - name: Run Django tests
        run: |
          docker run --rm \
            --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=test_db \
            -e DB_USER=test_user \
            -e DB_PASSWORD=test_password \
            -e SECRET_KEY=ci-test-secret-key-not-for-production \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e DEBUG=True \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:5173 \
            -e CSRF_TRUSTED_ORIGINS=http://localhost,http://localhost:5173 \
            npl-django \
            python manage.py test

  test-integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test .env
        run: |
          cat > .env << 'EOF'
          DEBUG=True
          SECRET_KEY=ci-test-secret-key-not-for-production
          DB_NAME=test_db
          DB_HOST=postgres
          DB_USER=test_user
          DB_PASSWORD=test_password
          DB_PORT=5432
          REDIS_URL=redis://redis:6379/0
          ALLOWED_HOSTS=localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:5173
          CSRF_TRUSTED_ORIGINS=http://localhost,http://localhost:5173
          EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
          EOF

      - name: Start services
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

      - name: Wait for Django to accept connections
        run: |
          for i in {1..30}; do
            if docker compose exec -T django python -c \
              "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',8000)); s.close()" 2>/dev/null; then
              echo "✅ Django is accepting connections"
              exit 0
            fi
            echo "⏳ Waiting for Django... ($i/30)"
            sleep 2
          done
          echo "❌ Django failed to start"
          docker compose logs django
          exit 1

      - name: Check frontend is serving
        run: |
          curl -f -s http://localhost/ > /dev/null || (echo "❌ Frontend not responding" && exit 1)
          echo "✅ Frontend is serving"

      - name: Verify API proxy is not failing
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/ || echo "000")
          if [ "$HTTP_CODE" = "502" ] || [ "$HTTP_CODE" = "503" ] || [ "$HTTP_CODE" = "000" ]; then
            echo "❌ API proxy failing (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "✅ API proxy responding (HTTP $HTTP_CODE)"

      - name: Run migrations
        run: docker compose exec -T django python manage.py migrate --noinput

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
