name: CI

on:
  push:
    branches: [Master, main]
  pull_request:
    branches: [Master, main]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for hardcoded localhost URLs in frontend
        run: |
          if grep -r "localhost:8000" npl-frontend/src/; then
            echo "❌ Found hardcoded localhost:8000 in frontend"
            exit 1
          fi
          echo "✅ No hardcoded localhost URLs found"

      - name: Create test .env
        run: |
          cat > .env << 'EOF'
          DEBUG=True
          SECRET_KEY=ci-test-secret-key-not-for-production
          DB_NAME=test_db
          DB_HOST=postgres
          DB_USER=test_user
          DB_PASSWORD=test_password
          DB_PORT=5432
          REDIS_URL=redis://redis:6379/0
          ALLOWED_HOSTS=localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:5173
          EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
          EOF

      - name: Validate docker-compose syntax
        run: docker compose config

      - name: Validate nginx config
        run: |
          docker run --rm -v "$PWD/npl-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test .env
        run: |
          cat > .env << 'EOF'
          DEBUG=True
          SECRET_KEY=ci-test-secret-key-not-for-production
          DB_NAME=test_db
          DB_HOST=postgres
          DB_USER=test_user
          DB_PASSWORD=test_password
          DB_PORT=5432
          REDIS_URL=redis://redis:6379/0
          ALLOWED_HOSTS=localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:5173
          EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
          EOF

      - name: Build all services
        run: docker compose build

      - name: Verify frontend builds with production env
        run: |
          test -f npl-frontend/.env.production || (echo "❌ Missing .env.production" && exit 1)
          docker build -t npl-frontend ./npl-frontend

  test-django:
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Django image
        run: docker build -t npl-django ./fpl_backend

      - name: Run Django tests
        run: |
          docker run --rm \
            --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=test_db \
            -e DB_USER=test_user \
            -e DB_PASSWORD=test_password \
            -e SECRET_KEY=ci-test-secret-key-not-for-production \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e DEBUG=True \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:5173 \
            npl-django \
            python manage.py test

  test-integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test .env
        run: |
          cat > .env << 'EOF'
          DEBUG=True
          SECRET_KEY=ci-test-secret-key-not-for-production
          DB_NAME=test_db
          DB_HOST=postgres
          DB_USER=test_user
          DB_PASSWORD=test_password
          DB_PORT=5432
          REDIS_URL=redis://redis:6379/0
          ALLOWED_HOSTS=localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:5173
          EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
          EOF

      - name: Start services
        run: docker compose up -d

      - name: Wait for services to be ready
        run: sleep 15

      - name: Check Django health (from inside container)
        run: |
          docker compose exec -T django curl -s http://localhost:8000/health/ | tee response.txt 
           grep -q '"status": "ok"' response.txt || exit 1

      - name: Check frontend is serving
        run: |
          curl -f http://localhost/ || exit 1

      - name: Run migrations
        run: docker compose exec -T django python manage.py migrate

      - name: Cleanup
        if: always()
        run: docker compose down -v
